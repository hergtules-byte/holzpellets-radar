
name: Tägliches Holzpellets-Radar

on:
  schedule:
    - cron: "15 5 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python installieren
        run: pip install requests

            - name: Ausschreibungen suchen
        env:
          VERGABEWEISER_API_KEY: ${{ secrets.VERGABEWEISER_API_KEY }}
        run: python update_data.py

      - name: Ergebnisse speichern
        run: |
          git config user.name "Holzpellets Radar Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/latest.json
          git diff --cached --quiet || (
            git commit -m "Tägliche Aktualisierung"
            git push
          )
