name: Tägliches Holzpellets-Radar

on:
  schedule:
    - cron: "15 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: pip install requests

      - name: Ausschreibungen suchen
        env:
          VERGABEWEISER_API_KEY: ${{ secrets.VERGABEWEISER_API_KEY }}
        run: python update_data.py

      - name: E-Mail bei neuen Ausschreibungen versenden
        continue-on-error: true
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: andrei.hergt@web.de
        run: python notify_new_results.py

      - name: Ergebnisse und Benachrichtigungsstatus speichern
        run: |
          git config user.name "Holzpellets Radar Bot"
          git config user.email "actions@users.noreply.github.com"

          git add data/latest.json data/notified_ids.json

          git diff --cached --quiet || git commit -m "Tägliche Aktualisierung"

          git pull --rebase -X theirs origin main
          git push origin HEAD:main
