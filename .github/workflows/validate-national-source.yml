name: Prüfung Bekanntmachungsservice

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/bekanntmachungsservice]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python-Dateien auf Syntax prüfen
        run: python -m compileall -q app.py update_data.py national_source.py ted_source.py
      - name: Abhängigkeiten installieren
        run: pip install requests
      - name: CSV-Tabellenstruktur auslesen
        run: |
          python - <<'PY'
          import csv, io, zipfile
          from datetime import date, timedelta
          import requests
          day = (date.today() - timedelta(days=1)).isoformat()
          response = requests.get("https://oeffentlichevergabe.de/api/notice-exports",
                                  params={"pubDay": day, "format": "csv.zip"}, timeout=120)
          response.raise_for_status()
          with zipfile.ZipFile(io.BytesIO(response.content)) as z:
              for name in z.namelist():
                  if not name.lower().endswith(".csv"):
                      continue
                  with z.open(name) as raw:
                      text = io.TextIOWrapper(raw, encoding="utf-8-sig", newline="")
                      reader = csv.DictReader(text)
                      rows = list(reader)
                  print("\nTABLE:", name, "| ROWS:", len(rows))
                  print("COLUMNS:", reader.fieldnames)
                  if name in ("notice.csv", "organisation.csv", "purpose.csv",
                              "classification.csv", "placeOfPerformance.csv",
                              "procedure.csv", "lot.csv", "tender.csv"):
                      for row in rows[:2]:
                          print("SAMPLE:", {k:v for k,v in row.items() if v})
          PY
      - name: CSV-Importer live testen
        run: |
          python - <<'PY'
          from national_source import fetch_national_notices
          rows, stats = fetch_national_notices()
          print("Exportstatistik:", stats)
          print("Treffer:", len(rows))
          for row in rows[:30]:
              print(row["state"], "|", row["woodpellet_check"], "|", row["title"][:140])
          PY
      - name: Kandidaten und Bundesland-Codes diagnostizieren
        run: |
          python - <<'PY'
          import csv, io, zipfile
          from datetime import date, timedelta
          import requests
          day = (date.today() - timedelta(days=1)).isoformat()
          r = requests.get("https://oeffentlichevergabe.de/api/notice-exports",
                           params={"pubDay": day, "format": "csv.zip"}, timeout=120)
          r.raise_for_status()
          with zipfile.ZipFile(io.BytesIO(r.content)) as z:
              def rows(name):
                  with z.open(name) as raw:
                      return list(csv.DictReader(io.TextIOWrapper(raw, encoding="utf-8-sig", newline="")))
              notices, purposes = rows("notice.csv"), rows("purpose.csv")
              places, orgs = rows("placeOfPerformance.csv"), rows("organisation.csv")
              classes = rows("classification.csv")
          def key(x): return (x.get("noticeIdentifier","").strip(), x.get("noticeVersion","").strip())
          pg={}
          for x in purposes: pg.setdefault(key(x), []).append(x)
          lg={}
          for x in places: lg.setdefault(key(x), []).append(x)
          og={}
          for x in orgs: og.setdefault(key(x), []).append(x)
          cg={}
          for x in classes: cg.setdefault(key(x), []).append(x)
          terms=("holzpellet","pelletlieferung","pellets","holzhackschnitzel","holzbrennstoff",
                 "brennstoffe auf holzbasis","bks","braunkohlestaub","braunkohle","steinkohle","kohle","brikett")
          hits=0
          for n in notices:
              k=key(n); ps=pg.get(k,[])
              title=" | ".join(x.get("title","") for x in ps)
              desc=" | ".join(x.get("description","") for x in ps)
              blob=(title+" "+desc).lower()
              if not any(t in blob for t in terms): continue
              hits+=1
              print("\nCANDIDATE", hits, "ID", k, "title", title[:300], "description", desc[:500])
              print("NOTICE:", n)
              print("PLACES:", lg.get(k,[]))
              print("ORGANISATIONS:", og.get(k,[]))
              print("CLASSIFICATIONS:", cg.get(k,[]))
          print("\nKEYWORD CANDIDATES TOTAL:", hits)
          print("\nALL UNIQUE PLACE SUBDIVISIONS:")
          print(sorted({(x.get("placePerformanceCountrySubdivision",""),x.get("placePerformanceCountryCode","")) for x in places}))
          print("\nALL UNIQUE ORGANISATION SUBDIVISIONS:")
          print(sorted({(x.get("organisationCountrySubdivision",""),x.get("organisationCountryCode","")) for x in orgs}))
          PY
      - name: TED-Brennstoffsuche gegen echte Datumsstichprobe testen
        run: |
          python - <<'PY'
          import requests
          url = "https://api.ted.europa.eu/v3/notices/search"
          queries = [
              "publication-date=20261102 AND FT~(\"pellets\")",
              "publication-date=20261102 AND FT~(\"holzpellets\")",
              "publication-date=20261102 AND FT~(\"wood pellets\")",
              "publication-date=20261102 AND buyer-country=DEU",
              "publication-date=20261102 AND classification-cpv=09111400",
          ]
          fields = ["publication-number", "publication-date", "notice-title",
                    "buyer-name", "buyer-country", "classification-cpv",
                    "place-of-performance", "deadline-receipt-tender-date-lot"]
          for query in queries:
              body = {"query": query, "fields": fields, "page": 1, "limit": 10,
                      "paginationMode": "PAGE_NUMBER", "scope": "ALL"}
              r = requests.post(url, json=body, timeout=90)
              print("\\nQUERY:", query, "| HTTP:", r.status_code)
              print("RESPONSE:", r.text[:3500])
              r.raise_for_status()
              data = r.json()
              print("COUNT:", data.get("totalNoticeCount"),
                    "| RECORDS:", len(data.get("notices", [])),
                    "| TIMED OUT:", data.get("timedOut"))
          PY
      - name: TED-Importer live testen
        run: |
          python - <<'PY'
          from ted_source import fetch_ted_notices
          rows, stats = fetch_ted_notices(days_back=60)
          print("TED-Statistik:", stats)
          print("TED-Treffer in Zielbundesländern:", len(rows))
          for row in rows[:30]:
              print(row["state"], "|", row["woodpellet_check"], "|", row["title"][:140], "|", row["url"])
          if stats["errors"]:
              raise SystemExit("TED-Abfragen teilweise fehlgeschlagen.")
          PY
