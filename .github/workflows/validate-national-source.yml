name: Prüfung Bekanntmachungsservice

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/bekanntmachungsservice]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python-Dateien auf Syntax prüfen
        run: python -m compileall -q app.py update_data.py national_source.py
      - name: Abhängigkeiten installieren
        run: pip install requests
      - name: Tagesexport in drei Formaten vergleichen
        run: |
          python - <<'PY'
          import io, zipfile
          from datetime import date, timedelta
          import requests
          day = (date.today() - timedelta(days=1)).isoformat()
          base = "https://oeffentlichevergabe.de/api/notice-exports"
          for fmt in ("ocds.zip", "eforms.zip", "csv.zip"):
              try:
                  response = requests.get(base, params={"pubDay": day, "format": fmt}, timeout=120)
                  print("\nFORMAT:", fmt, "| HTTP:", response.status_code,
                        "| Content-Type:", response.headers.get("Content-Type"),
                        "| Bytes:", len(response.content),
                        "| Content-Disposition:", response.headers.get("Content-Disposition"))
                  response.raise_for_status()
                  if response.content.startswith(b"PK"):
                      with zipfile.ZipFile(io.BytesIO(response.content)) as archive:
                          names = archive.namelist()
                          print("ZIP-Einträge:", len(names), "| Beispiele:", names[:8])
                          if fmt == "csv.zip":
                              csv_names = [n for n in names if n.lower().endswith(".csv")]
                              for name in csv_names[:3]:
                                  raw = archive.read(name)
                                  print("CSV-Beispiel:", name, "| Bytes:", len(raw),
                                        "| Kopf:", raw[:700].decode("utf-8-sig", errors="replace").replace("\n", " ")[:700])
                          else:
                              json_names = [n for n in names if n.lower().endswith(".json")]
                              print("JSON-Dateien:", len(json_names))
                              for name in json_names[:2]:
                                  raw = archive.read(name)
                                  print("Datei-Beispiel:", name, "| Bytes:", len(raw),
                                        "| Kopf:", raw[:500].decode("utf-8-sig", errors="replace").replace("\n", " ")[:500])
                  else:
                      print("Antwort-Anfang:", response.text[:500].replace("\n", " "))
              except Exception as exc:
                  print("FEHLER:", fmt, type(exc).__name__, str(exc)[:300])
          PY
      - name: Bestehenden OCDS-Filter prüfen
        run: |
          python - <<'PY'
          from national_source import fetch_national_notices
          rows, meta = fetch_national_notices()
          print("OCDS-Filter:", meta, "| Treffer:", len(rows))
          PY
