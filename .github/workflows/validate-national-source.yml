name: Prüfung Bekanntmachungsservice

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/bekanntmachungsservice]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python-Dateien auf Syntax prüfen
        run: python -m compileall -q app.py update_data.py national_source.py
      - name: Abhängigkeiten installieren
        run: pip install requests
      - name: OpenData-Export live abrufen und auswerten
        run: |
          python - <<'PY'
          from national_source import fetch_national_notices
          rows, day = fetch_national_notices()
          print(f"Export {day}: {len(rows)} passende Treffer")
          for row in rows[:20]:
              print(row["state"], row["woodpellet_check"], row["title"][:120])
          PY
